services: 
  frontend: 
    build: 
      context: ./frontend 
      dockerfile: Dockerfile 
      ports: 
        - "3000:3000" 
      depends_on: - backend 
  backend: 
    build: 
      context: ./backend 
      dockerfile: Dockerfile 
      ports: 
        - "5000:5000" 
      environment: 
        DATABASE_URL: postgres://myuser:mypassword@database:5432/myapp 
      depends_on: 
        - database 
        
  database: 
    image: postgres:16 
      environment: 
        POSTGRES_DB: myapp 
        POSTGRES_USER: myuser 
        POSTGRES_PASSWORD: mypassword 
      ports: - "5432:5432" 
      volumes: - postgres_data:/var/lib/postgresql/data 
      
  volumes: postgres_data: