services: 
  frontend: 
    build: 
      context: ./frontend 
      dockerfile: Dockerfile 
    ports: 
      - "3000:80" # nginx listens on port 80
    depends_on: 
      - backend 

  backend: 
    build: 
      context: ./backend 
      dockerfile: Dockerfile 
    ports: 
      - "5000:3000" # express listens on 3000 
    environment: 
      DATABASE_URL: postgres://myuser:mypassword@database:5432/myapp 
    depends_on: 
      - database 
        
  database: 
    image: postgres:18-alpine 
    environment: 
      POSTGRES_DB: myapp 
      POSTGRES_USER: myuser 
      POSTGRES_PASSWORD: mypassword 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql
      
volumes: 
  postgres_data: